# The Javadoc of the public surface, published to GitHub Pages on every push to main
# (https://vecbricks.github.io/jegg/). Pages must be enabled for the repository once, with
# "GitHub Actions" as the source.
name: Javadoc

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
          cache: maven
      - name: Build the Javadoc
        run: mvn -B --no-transfer-progress -q javadoc:javadoc
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/reports/apidocs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

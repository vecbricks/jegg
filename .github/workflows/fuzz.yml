# Differential fuzzing against egg (dev/fuzz.sh, #44) where cargo is: egg 73975c9 is built once
# per cache, then prop and math random terms run through egg and jegg and their counts are
# compared. Dispatched by hand with a ref, a count and a seed; a PR that touches the matcher,
# the graph or the runner links its run (AGENTS.md, oracle 2). A divergence is shrunk to
# dev/fuzz/found/ and uploaded with the logs.
name: Fuzz

on:
  workflow_dispatch:
    inputs:
      ref:
        description: the branch or commit to fuzz
        default: main
      count:
        description: random terms per language
        default: "200"
      seed:
        description: the seed of the terms
        default: "2"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jegg/egg
          key: egg-73975c9-${{ hashFiles('dev/fuzz/*.rs') }}-${{ runner.os }}
      - name: The known-answer gate, prop and math
        run: dev/fuzz.sh --known prop && dev/fuzz.sh --known math
      - name: Fuzz prop
        id: prop
        continue-on-error: true
        run: dev/fuzz.sh prop "${{ inputs.count }}" "${{ inputs.seed }}" | tee prop.out
      - name: Fuzz math
        id: math
        continue-on-error: true
        run: dev/fuzz.sh math "${{ inputs.count }}" "${{ inputs.seed }}" | tee math.out
      - name: Summary
        if: always()
        run: |
          {
            echo '## Fuzz: `${{ inputs.ref }}`, ${{ inputs.count }} terms, seed ${{ inputs.seed }}'
            echo
            echo '```'
            grep -h '^FUZZ' prop.out math.out || echo 'no FUZZ summary line: see the logs'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fuzz-${{ github.run_number }}
          path: |
            dev/fuzz/found/
            target/fuzz/*.log
            prop.out
            math.out
          if-no-files-found: ignore
      - name: Fail if a language diverged
        if: steps.prop.outcome == 'failure' || steps.math.outcome == 'failure'
        run: exit 1

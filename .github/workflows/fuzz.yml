# Differential fuzzing against egg (dev/fuzz.sh, #44) where cargo is: egg 73975c9 is built once
# per cache, then prop and math random terms run through egg and jegg and their counts are
# compared. Dispatched by hand with a ref, a count and a seed; a PR that touches the matcher,
# the graph or the runner links its run (AGENTS.md, oracle 2). A divergence is shrunk to
# dev/fuzz/found/ and uploaded with the logs. With compare=true a second job runs
# dev/compare.sh after it (#72): jegg's time against egg's on the same terms, by phase. With
# probe=true a job runs dev/probe.sh (#134): the rebuild's counts on both sides and a profile.
name: Fuzz

on:
  workflow_dispatch:
    inputs:
      ref:
        description: the branch or commit to fuzz
        default: main
      count:
        description: random terms per language
        default: "200"
      seed:
        description: the seed of the terms
        default: "2"
      compare:
        description: also time jegg against egg on the terms, by phase (#72)
        type: boolean
        default: false
      rounds:
        description: rounds of the comparison, each side once per round
        default: "5"
      probe:
        description: also count the rebuild's work on both sides and profile jegg's (#134)
        type: boolean
        default: false
      host:
        description: >-
          the named host (dev/host.sh) the compare and probe jobs must land on; any skips it
        type: choice
        options: [any, epyc7763, epyc9v74, epyc9v45, xeon6975p]
        default: any

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jegg/egg
          key: egg-73975c9-${{ hashFiles('dev/fuzz/*.rs', 'dev/fuzz/*.patch') }}-${{ runner.os }}
      - name: The known-answer gate, prop and math
        run: dev/fuzz.sh --known prop && dev/fuzz.sh --known math
      - name: Fuzz prop
        id: prop
        continue-on-error: true
        run: dev/fuzz.sh prop "${{ inputs.count }}" "${{ inputs.seed }}" | tee prop.out
      - name: Fuzz math
        id: math
        continue-on-error: true
        run: dev/fuzz.sh math "${{ inputs.count }}" "${{ inputs.seed }}" | tee math.out
      - name: Summary
        if: always()
        run: |
          {
            echo '## Fuzz: `${{ inputs.ref }}`, ${{ inputs.count }} terms, seed ${{ inputs.seed }}'
            echo
            echo '```'
            grep -h '^FUZZ' prop.out math.out || echo 'no FUZZ summary line: see the logs'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fuzz-${{ github.run_number }}
          path: |
            dev/fuzz/found/
            target/fuzz/*.log
            prop.out
            math.out
          if-no-files-found: ignore
      - name: Fail if a language diverged
        if: steps.prop.outcome == 'failure' || steps.math.outcome == 'failure'
        run: exit 1
  compare:
    needs: fuzz
    if: inputs.compare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # A timing compares only with a timing on the same host (#152): a run that drew another
      # CPU fails here, before anything is built, and dev/dispatch.sh tries again.
      - name: Check the runner's CPU
        run: |
          echo "CPU: $(dev/host.sh --cpu)"
          if [ "${{ inputs.host }}" != any ]; then
            dev/host.sh --expect "${{ inputs.host }}"
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jegg/egg
          key: egg-73975c9-${{ hashFiles('dev/fuzz/*.rs', 'dev/fuzz/*.patch') }}-${{ runner.os }}
      - name: Compare jegg with egg
        run: >-
          dev/compare.sh "${{ inputs.rounds }}" "${{ inputs.count }}" "${{ inputs.seed }}"
          compare
      - name: Summary
        if: always()
        run: |
          {
            echo '# jegg against egg: `${{ inputs.ref }}` on `${{ inputs.host }}`'
            echo
            echo '```'
            cat compare/provenance.txt
            echo '```'
            echo
            cat compare/summary.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: compare-${{ github.run_number }}
          path: compare/
          if-no-files-found: ignore
  probe:
    needs: fuzz
    if: inputs.probe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Check the runner's CPU
        run: |
          echo "CPU: $(dev/host.sh --cpu)"
          if [ "${{ inputs.host }}" != any ]; then
            dev/host.sh --expect "${{ inputs.host }}"
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jegg/egg
          key: egg-73975c9-${{ hashFiles('dev/fuzz/*.rs', 'dev/fuzz/*.patch') }}-${{ runner.os }}
      - name: Count and profile the rebuild
        run: dev/probe.sh "${{ inputs.count }}" "${{ inputs.seed }}" probe
      - name: Summary
        if: always()
        run: |
          {
            echo '# The rebuild against egg: `${{ inputs.ref }}`'
            echo
            echo '```'
            cat probe/provenance.txt
            echo '```'
            echo
            cat probe/summary.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: probe-${{ github.run_number }}
          path: probe/
          if-no-files-found: ignore
